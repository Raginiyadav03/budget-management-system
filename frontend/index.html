<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="theme-toggle-container">
                    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                        <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
                <h1>💰 Budget Management System</h1>
                <div class="header-right"></div>
            </div>
            <div class="balance-cards">
                <div class="balance-card">
                    <h2>Total Income</h2>
                    <p class="balance-amount income-amount" id="totalIncome">₹0.00</p>
                </div>
                <div class="balance-card">
                    <h2>Total Expense</h2>
                    <p class="balance-amount expense-amount" id="totalExpense">₹0.00</p>
                </div>
                <div class="balance-card">
                    <h2>Total Balance</h2>
                    <p class="balance-amount" id="totalBalance">₹0.00</p>
                </div>
                <div class="balance-card">
                    <h2>Saving Status</h2>
                    <p class="balance-amount saving-status" id="savingStatus">-</p>
                </div>
            </div>
        </header>
        <a href="comparison.html" class="comparison-link-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>View Monthly Comparison</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>
        <main>
            <section class="transaction-form">
                <h2>Add Transaction</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" step="0.01" placeholder="Enter amount" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="">Select type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date & Time</label>
                        <input type="datetime-local" id="date" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </section>

            <section class="transactions-section">
                <div class="section-header">
                    <div class="section-title-row">
                        <h2>Transactions</h2>
                        <div class="search-container">
                            <input type="text" id="searchInput" class="search-input" placeholder="Search transactions..." oninput="handleSearch()">
                            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="header-controls">
                        <div class="filter-buttons">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="income">Income</button>
                            <button class="filter-btn" data-filter="expense">Expense</button>
                        </div>
                        <div class="advanced-filters">
                            <div class="filter-group">
                                <label for="monthFilter">Month:</label>
                                <select id="monthFilter" class="filter-select" onchange="handleMonthFilter()">
                                    <option value="">All Months</option>
                                    <option value="01">January</option>
                                    <option value="02">February</option>
                                    <option value="03">March</option>
                                    <option value="04">April</option>
                                    <option value="05">May</option>
                                    <option value="06">June</option>
                                    <option value="07">July</option>
                                    <option value="08">August</option>
                                    <option value="09">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="amountFilter">Amount:</label>
                                <select id="amountFilter" class="filter-select" onchange="handleAmountFilter()">
                                    <option value="">All Amounts</option>
                                    <option value="above1000">Above ₹1000</option>
                                    <option value="below500">Below ₹500</option>
                                    <option value="between">Between</option>
                                </select>
                            </div>
                            <div class="filter-group" id="betweenAmountGroup" style="display: none;">
                                <label for="amountFrom">From:</label>
                                <input type="number" id="amountFrom" class="filter-input" placeholder="Min" step="0.01" onchange="handleAmountFilter()">
                                <label for="amountTo">To:</label>
                                <input type="number" id="amountTo" class="filter-input" placeholder="Max" step="0.01" onchange="handleAmountFilter()">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="transactions-list" id="transactionsList">
                    <p class="empty-message">No transactions yet. Add your first transaction above!</p>
                </div>
                <div class="pagination-container-row">
                    <div class="pagination-container" id="paginationContainer"></div>
                    <div class="items-per-page">
                        <label for="itemsPerPage">Show:</label>
                        <select id="itemsPerPage" onchange="changeItemsPerPage()">
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Comparison Button Section -->
        </main>
    </div>

    <!-- Edit Transaction Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Transaction</h2>
                <span class="close-modal" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <input type="text" id="editDescription" placeholder="Enter description" required>
                </div>
                <div class="form-group">
                    <label for="editAmount">Amount</label>
                    <input type="number" id="editAmount" step="0.01" placeholder="Enter amount" required>
                </div>
                <div class="form-group">
                    <label for="editType">Type</label>
                    <select id="editType" required>
                        <option value="">Select type</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editDate">Date & Time</label>
                    <input type="datetime-local" id="editDate" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alert Popup -->
    <div id="alertPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-message" id="alertMessage"></div>
            <div class="popup-buttons">
                <button class="btn btn-primary" onclick="closeAlert()">OK</button>
            </div>
        </div>
    </div>

    <!-- Confirm Popup -->
    <div id="confirmPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon">❓</div>
            <div class="popup-message" id="confirmMessage"></div>
            <div class="popup-buttons">
                <button class="btn btn-secondary" onclick="closeConfirm(false)">Cancel</button>
                <button class="btn btn-primary" onclick="closeConfirm(true)">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner-content">
            <div class="spinner"></div>
            <p class="spinner-text">Loading...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
